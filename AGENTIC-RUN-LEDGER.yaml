  occurrences:
  - observed_at: '2026-07-23T18:36:31Z'
    run_id: ip-published-qa-2026-07-23-aa860ec9-8803-4d28-a4de-e1b3d144c498
    reporter:
      type: subagent
      name: public_http_audit
      role: read-only live-store HTTP auditor
      thread_id: /root/public_http_audit
    context:
      workflow: test
      phase: published-store verification
      task: custom-domain routing
      operation: public HTTP and DNS inspection
    run_impact: degraded
    observation:
      symptom: Visitors to independencephone.com receive the WordPress/WooCommerce site instead of the published Shopify theme.
      expected: The client-facing custom domain should resolve to the published Shopify storefront.
      actual: DNS resolves independencephone.com to 207.246.255.73 and HTTP identifies WordPress and WooCommerce, while Shopify
        remains on its password-protected MyShopify domain.
      evidence:
      - kind: test
        ref: https://independencephone.com/
        detail: HTTP 200 identifies WordPress/WooCommerce; MyShopify separately reports published theme 151266459717.
      root_cause:
        confidence: confirmed
        detail: The apex A record targets the existing WordPress host rather than Shopify.
      workaround: Audit Shopify assets through its CDN and use the authenticated browser session for storefront rendering.
      suggested_fix: After approval, connect the custom domain to Shopify or update DNS according to the intended cutover.
