  occurrences:
  - observed_at: '2026-07-23T18:02:26Z'
    run_id: shopify-product-photo-diagnosis-20260723
    reporter:
      type: orchestrator
      name: root
      role: main agent
      thread_id: null
    context:
      workflow: test
      phase: null
      task: null
      operation: null
    run_impact: degraded
    observation:
      symptom: The published Shopify order builder shows rear phone photographs with clipping that does not match the approved
        front-photo page.
      expected: The customer-facing order builder should use the approved 800x640 Classic and Rugged front composites with
        no clip-path or transform.
      actual: Live theme 151228809285 references ip-classic-phone-back.webp and ip-rugged-phone-back.webp and applies polygon
        clip paths and scale transforms; unpublished QA theme 151266459717 contains the approved front references and corrected
        CSS.
      evidence:
      - kind: artifact
        ref: <external-path>/indy-photo-diagnosis.qDTYJE
        detail: Read-only Shopify theme pulls and role checks on 2026-07-23 confirmed the live-versus-QA source mismatch in
          both ip-order-builder.liquid and page.liquid, plus the old clipping rules in live ip-theme.css.
      root_cause:
        confidence: confirmed
        detail: The former QA theme was published before the later front-photo correction; safety controls then placed that
          correction on a fresh unpublished QA duplicate instead of mutating the live theme.
      workaround: Review unpublished QA theme 151266459717 to see the corrected page.
      suggested_fix: After explicit approval, publish the tested QA theme or perform a narrowly reviewed live deployment of
        the front assets, Liquid references, and matching CSS together.
