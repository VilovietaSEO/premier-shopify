    event: opened
    detail: First observed in run ip-published-qa-2026-07-23-aa860ec9-8803-4d28-a4de-e1b3d144c498.
  occurrences:
  - observed_at: '2026-07-23T18:36:20Z'
    run_id: ip-published-qa-2026-07-23-aa860ec9-8803-4d28-a4de-e1b3d144c498
    reporter:
      type: subagent
      name: static_theme_audit
      role: read-only static auditor
      thread_id: null
    context:
      workflow: test
      phase: static audit
      task: Quick Published-Store Check
      operation: source search
    run_impact: recovered
    observation:
      symptom: The initial broad checklist regex produced more than 30,000 tokens and was truncated.
      expected: The first search should return a compact set of relevant source evidence.
      actual: The broad query included generic terms such as product, total, and setup across CSS and templates.
      evidence:
      - kind: command
        ref: static theme audit search
        detail: Search returned 1,077 lines and required focused follow-up reads.
      root_cause:
        confidence: confirmed
        detail: The initial query combined high-frequency generic terms with all theme source folders.
      workaround: Repeated the audit using focused files and narrow line ranges.
      suggested_fix: Begin future theme audits with route templates and their directly referenced sections before broad string
        searches.
