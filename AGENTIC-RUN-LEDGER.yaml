- id: ARL-0001
  fingerprint: 1c90e409de4cbf07
  title: Password-gated Shopify preview loses authenticated browser state between QA runs
  scope: agentic-system
  category: friction
  layers:
  - process
  - runtime
  - third-party-api
  severity: medium
  max_run_impact: blocked
  status: open
  first_observed_at: '2026-07-23T02:23:36Z'
  last_observed_at: '2026-07-23T02:23:36Z'
  occurrence_count: 1
  tags: []
  resolution:
    resolved_at: null
    summary: null
    verified_by: []
    graduated_to: null
  history:
  - at: '2026-07-23T02:23:36Z'
    event: opened
    detail: First observed in run shopify-full-page-screenshots-20260722.
  occurrences:
  - observed_at: '2026-07-23T02:23:36Z'
    run_id: shopify-full-page-screenshots-20260722
    reporter:
      type: orchestrator
      name: root
      role: main agent
      thread_id: null
    context:
      workflow: test
      phase: null
      task: null
      operation: null
    run_impact: blocked
    observation:
      symptom: The unpublished Shopify preview redirected to the storefront password page before screenshots could be captured.
      expected: The existing browser session should open the previously authenticated QA preview for read-only screenshot
        capture.
      actual: The only available browser surface had no active storefront password session and required manual re-entry.
      evidence:
      - kind: error
        ref: https://jordan-mark-premier.myshopify.com/password
        detail: Direct navigation to unpublished QA theme 151266459717 ended at the password page; no alternate browser surface
          was available.
      root_cause:
        confidence: unknown
        detail: The prior storefront password session is no longer present; expiration or profile-state change was not inspected.
      workaround: Left the password page open for the user to authenticate, then resume the same screenshot run.
      suggested_fix: Preflight password-gated preview access at the start of future live Shopify QA capture runs.
- id: ARL-0002
  fingerprint: 90d9a1f76e129b40
  title: Published order builder uses superseded rear-phone selector media
  scope: product-under-test
  category: quality-reduction
  layers:
  - process
  - ui
  severity: medium
  max_run_impact: degraded
  status: open
  first_observed_at: '2026-07-23T18:02:26Z'
  last_observed_at: '2026-07-23T18:02:26Z'
  occurrence_count: 1
  tags: []
  resolution:
    resolved_at: null
    summary: null
    verified_by: []
    graduated_to: null
  history:
  - at: '2026-07-23T18:02:26Z'
    event: opened
    detail: First observed in run shopify-product-photo-diagnosis-20260723.
  occurrences:
  - observed_at: '2026-07-23T18:02:26Z'
    run_id: shopify-product-photo-diagnosis-20260723
    reporter:
      type: orchestrator
      name: root
      role: main agent
      thread_id: null
    context:
      workflow: test
      phase: null
      task: null
      operation: null
    run_impact: degraded
    observation:
      symptom: The published Shopify order builder shows rear phone photographs with clipping that does not match the approved
        front-photo page.
      expected: The customer-facing order builder should use the approved 800x640 Classic and Rugged front composites with
        no clip-path or transform.
      actual: Live theme 151228809285 references ip-classic-phone-back.webp and ip-rugged-phone-back.webp and applies polygon
        clip paths and scale transforms; unpublished QA theme 151266459717 contains the approved front references and corrected
        CSS.
      evidence:
      - kind: artifact
        ref: <external-path>/indy-photo-diagnosis.qDTYJE
        detail: Read-only Shopify theme pulls and role checks on 2026-07-23 confirmed the live-versus-QA source mismatch in
          both ip-order-builder.liquid and page.liquid, plus the old clipping rules in live ip-theme.css.
      root_cause:
        confidence: confirmed
        detail: The former QA theme was published before the later front-photo correction; safety controls then placed that
          correction on a fresh unpublished QA duplicate instead of mutating the live theme.
      workaround: Review unpublished QA theme 151266459717 to see the corrected page.
      suggested_fix: After explicit approval, publish the tested QA theme or perform a narrowly reviewed live deployment of
        the front assets, Liquid references, and matching CSS together.
