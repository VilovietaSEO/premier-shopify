- id: ARL-0001
  fingerprint: 1c90e409de4cbf07
  title: Password-gated Shopify preview loses authenticated browser state between QA runs
  scope: agentic-system
  category: friction
  layers:
  - process
  - runtime
  - third-party-api
  severity: medium
  max_run_impact: blocked
  status: open
  first_observed_at: '2026-07-23T02:23:36Z'
  last_observed_at: '2026-07-23T02:23:36Z'
  occurrence_count: 1
  tags: []
  resolution:
    resolved_at: null
    summary: null
    verified_by: []
    graduated_to: null
  history:
  - at: '2026-07-23T02:23:36Z'
    event: opened
    detail: First observed in run shopify-full-page-screenshots-20260722.
  occurrences:
  - observed_at: '2026-07-23T02:23:36Z'
    run_id: shopify-full-page-screenshots-20260722
    reporter:
      type: orchestrator
      name: root
      role: main agent
      thread_id: null
    context:
      workflow: test
      phase: null
      task: null
      operation: null
    run_impact: blocked
    observation:
      symptom: The unpublished Shopify preview redirected to the storefront password page before screenshots could be captured.
      expected: The existing browser session should open the previously authenticated QA preview for read-only screenshot
        capture.
      actual: The only available browser surface had no active storefront password session and required manual re-entry.
      evidence:
      - kind: error
        ref: https://jordan-mark-premier.myshopify.com/password
        detail: Direct navigation to unpublished QA theme 151266459717 ended at the password page; no alternate browser surface
          was available.
      root_cause:
        confidence: unknown
        detail: The prior storefront password session is no longer present; expiration or profile-state change was not inspected.
      workaround: Left the password page open for the user to authenticate, then resume the same screenshot run.
      suggested_fix: Preflight password-gated preview access at the start of future live Shopify QA capture runs.
